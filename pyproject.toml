[project]
name = "federated-anomaly-lab"
version = "0.1.0"
description = "Experiments on federated anomaly detection under heterogeneous and malicious client behavior."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]